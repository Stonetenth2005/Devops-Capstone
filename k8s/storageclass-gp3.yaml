# EKS only: gp3 EBS volumes via the EBS CSI driver installed by Terraform.
# PostgreSQL's PersistentVolumeClaim uses this class (helm/clinicflow/values-prod.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  fsType: ext4
