# Lab 1: a Deployment whose image tag does not exist -> ImagePullBackOff.
# kubectl apply -f troubleshooting/broken-image.yaml
# kubectl get pods -n clinicflow ; kubectl describe pod -n clinicflow -l app=broken-image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicflow-broken-image
  namespace: clinicflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-image }
  template:
    metadata:
      labels: { app: broken-image }
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/clinicflow-backend:does-not-exist
