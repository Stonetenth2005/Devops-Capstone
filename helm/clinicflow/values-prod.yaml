# AWS EKS (cluster from terraform/). The app is reached through the ingress-nginx
# load balancer's DNS name, so no host is set.
backend:
  replicaCount: 2
frontend:
  replicaCount: 2
postgres:
  storageClass: gp3
ingress:
  enabled: true
  host: ""
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
