{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Loaded automatically by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicflow.fullname" . }}-grafana-dashboard
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  clinicflow.json: |-
{{ .Files.Get "dashboards/clinicflow.json" | indent 4 }}
{{- end }}
