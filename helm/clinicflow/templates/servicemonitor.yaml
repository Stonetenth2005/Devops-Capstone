{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "clinicflow.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
